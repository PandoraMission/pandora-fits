[tool.poetry]
name = "pandorafits"
version = "0.6.0"
description = "Tools to work with fits files for Pandora"
authors = ["Christina Hedges <christina.l.hedges@nasa.gov>"]
license = "MIT"
readme = "docs/README.md"
packages = [
    { include = "pandorafits", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
pandas = "^2.2.2"
lxml = "^5.3.0"
astropy = ">=5"
openpyxl = "^3.1.5"
pandoraaperture = ">=0.2.0"
pandoraref = ">=2.6.0"
sparse3d = ">=1.2.11"
fitsio = {version = "^1.3.0", optional = true}
astroquery = "^0.4.11"
pandoraspacecraft = ">=1.2.3"
lamatrix = ">=1.0.3"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
black = "25.11.0"
jupyterlab = "^4.5.0"
flake8 = "^7.3.0"
matplotlib = ">=2"
pylint = "<=4.0.4"
mkdocs = "^1.6.1"
mkdocs-jupyter = "^0.25.1"
mkdocs-material = "^9.6.5"
pytkdocs = {version = "^0.16.2", extras = ["numpy-style"]}
mkdocs-include-markdown-plugin = "^7.1.4"
mkdocstrings = {version = "^0.28.2", extras = ["python"]}
jupyter-contrib-nbextensions = "^0.7.0"
notebook = ">=6.0.0,<7.0.0"
line-profiler = "^5.0.2"
fbpca = "^1.0"
pandorasat = "^0.12.6"
ipywidgets = "^8.1.8"
ipympl = "^0.10.0"

[tool.poetry.extras]
database = ["fitsio"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79

[tool.isort]
skip = ["__init__.py", "database/__init__.py"]
import_heading_firstparty = 'First-party/Local'
import_heading_future = 'Future'
import_heading_stdlib = 'Standard library'
import_heading_thirdparty = 'Third-party'
line_length = 79
multi_line_output = 3
no_lines_before = 'LOCALFOLDER'
profile = 'black'